<script>
const pages = ["<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#140008\">\n<title>❤️ Crimson Love ❤️</title>\n\n<style>\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  width: 100%;\n  min-height: 100%;\n}\n\nbody {\n  position: relative;\n  overflow: hidden;\n  min-height: 100vh;\n  min-height: 100dvh;\n  background: radial-gradient(circle at center, #30000b 0%, #140008 48%, #030004 100%);\n  font-family: Arial, sans-serif;\n  color: white;\n}\n\n#space {\n  position: fixed;\n  inset: 0;\n  display: block;\n  width: 100%;\n  height: 100%;\n  z-index: 0;\n}\n\n.title {\n  position: fixed;\n  top: max(24px, calc(env(safe-area-inset-top) + 16px));\n  left: 16px;\n  right: 16px;\n  width: auto;\n  text-align: center;\n  z-index: 2;\n  pointer-events: none;\n}\n\n.title h1 {\n  font-size: clamp(22px, 5.5vw, 42px);\n  line-height: 1.2;\n  letter-spacing: clamp(2px, 0.7vw, 5px);\n  overflow-wrap: anywhere;\n  background: linear-gradient(90deg, #ffb3c1, #ff1744, #8b001d, #ff4569, #ffb3c1);\n  background-size: 300%;\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  animation: shine 5s linear infinite;\n  filter: drop-shadow(0 0 12px #ff1744);\n}\n\n.title p {\n  font-size: clamp(9px, 2.2vw, 11px);\n  letter-spacing: clamp(2px, 0.6vw, 4px);\n  margin-top: 9px;\n  color: #ff9cac;\n  opacity: 0.8;\n}\n\n@keyframes shine {\n  to { background-position: 300% center; }\n}\n\n\n\n.hint {\n  position: fixed;\n  bottom: max(12px, calc(env(safe-area-inset-bottom) + 5px));\n  left: 90px;\n  right: 16px;\n  text-align: center;\n  font-size: clamp(8px, 2vw, 10px);\n  letter-spacing: clamp(1px, 0.4vw, 2px);\n  color: #b96b7b;\n  pointer-events: none;\n}\n\n.back {\n  position: fixed;\n  z-index: 6;\n  left: max(14px, calc(env(safe-area-inset-left) + 8px));\n  bottom: max(10px, calc(env(safe-area-inset-bottom) + 5px));\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  border: 1px solid rgba(255, 150, 170, .65);\n  border-radius: 24px;\n  padding: 9px 15px;\n  background: rgba(80, 0, 20, .82);\n  color: #ffe1e8;\n  font-size: 12px;\n  font-weight: 600;\n  cursor: pointer;\n  box-shadow: 0 0 16px rgba(255, 0, 50, .18);\n  backdrop-filter: blur(8px);\n  -webkit-backdrop-filter: blur(8px);\n}\n\n.back:active {\n  transform: scale(.96);\n}\n\n@media (max-width: 600px) {\n  .title {\n    top: max(28px, calc(env(safe-area-inset-top) + 18px));\n  }\n\n  .hint {\n    left: 105px;\n    right: 10px;\n    bottom: max(15px, calc(env(safe-area-inset-bottom) + 8px));\n    font-size: 8px;\n    letter-spacing: 1px;\n  }\n\n  .back {\n    padding: 8px 12px;\n    font-size: 11px;\n  }\n}\n\n@media (max-height: 500px) and (orientation: landscape) {\n  .title {\n    top: max(10px, calc(env(safe-area-inset-top) + 6px));\n  }\n\n  .title p {\n    margin-top: 4px;\n  }\n\n  .music {\n    bottom: max(12px, calc(env(safe-area-inset-bottom) + 5px));\n    left: auto;\n    right: 14px;\n    transform: none;\n  }\n\n  .hint {\n    display: none;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .title h1 {\n    animation: none;\n  }\n}\n</style>\n</head>\n\n<body>\n<canvas id=\"space\"></canvas>\n\n<div class=\"title\">\n  <h1>LOVE YOU ❤️</h1>\n  <p>MADE WITH LOVE</p>\n</div>\n\n<div class=\"hint\">A LITTLE PIECE OF MY HEART</div>\n<script>\nconst canvas = document.getElementById(\"space\");\nconst ctx = canvas.getContext(\"2d\");\n\n\nlet w, h, dpr;\nlet particles = [];\nlet stars = [];\nlet flowers = [];\nlet rotation = 0;\nlet progress = 0;\nlet lastTime = 0;\nlet heartScale = 1;\nlet elapsed = 0;\n\nfunction resize() {\n  dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.5 : 1.8);\n  w = window.innerWidth;\n  h = window.innerHeight;\n\n  canvas.width = Math.round(w * dpr);\n  canvas.height = Math.round(h * dpr);\n  canvas.style.width = w + \"px\";\n  canvas.style.height = h + \"px\";\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n\n  // Skala hati dibatasi agar tetap proporsional pada layar kecil maupun lebar.\n  heartScale = Math.min(w, h) * 0.023;\n  createHeart();\n  createStars();\n  createFlowers();\n}\n\nfunction heartPoint(t) {\n  return {\n    x: 16 * Math.pow(Math.sin(t), 3),\n    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) -\n      2 * Math.cos(3 * t) - Math.cos(4 * t))\n  };\n}\n\nfunction createHeart() {\n  particles = [];\n\n  // Partikel tersebar sampai ke bagian dalam bentuk hati agar LOVE terlihat tebal/padat.\n  const area = Math.min(w, h);\n  const count = Math.max(1050, Math.min(2100, Math.floor(area * 2.15)));\n\n  for (let i = 0; i < count; i++) {\n    const t = Math.random() * Math.PI * 2;\n    const edge = heartPoint(t);\n    // Akar kuadrat membuat sebaran lebih merata dan tidak menumpuk di tengah.\n    const fill = 0.12 + 0.88 * Math.sqrt(Math.random());\n    const angle = Math.random() * Math.PI * 2;\n    const distance = Math.max(w, h) * (0.32 + Math.random() * 0.72);\n\n    particles.push({\n      tx: edge.x * heartScale * fill,\n      ty: edge.y * heartScale * fill,\n      sx: Math.cos(angle) * distance,\n      sy: Math.sin(angle) * distance,\n      size: 0.8 + Math.random() * 1.9,\n      delay: Math.random() * 0.38,\n      twinkle: Math.random() * Math.PI * 2,\n      hue: Math.random()\n    });\n  }\n}\n\nfunction createStars() {\n  stars = [];\n  for (let i = 0; i < 160; i++) {\n    stars.push({\n      x: Math.random() * w,\n      y: Math.random() * h,\n      size: Math.random() * 1.5 + 0.3,\n      alpha: Math.random()\n    });\n  }\n}\n\nfunction drawStars(time) {\n  for (const s of stars) {\n    const a = 0.18 + 0.62 * (0.5 + 0.5 *\n      Math.sin(time * 0.0011 + s.alpha * 12));\n    ctx.beginPath();\n    ctx.arc(s.x, s.y, s.size * (0.85 + a * 0.25), 0, Math.PI * 2);\n    ctx.fillStyle = `rgba(255,195,211,${a})`;\n    ctx.shadowColor = \"rgba(255,80,125,.7)\";\n    ctx.shadowBlur = s.size * 3;\n    ctx.fill();\n  }\n  ctx.shadowBlur = 0;\n}\n\nfunction drawHeart(time) {\n  const cx = w / 2;\n  const cy = h / 2;\n  const pulse = 1 + Math.sin(time * 0.0017) * 0.012;\n  const glowRadius = Math.min(w, h) * 0.46;\n  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);\n\n  glow.addColorStop(0, \"rgba(255,0,45,0.19)\");\n  glow.addColorStop(0.52, \"rgba(180,0,35,0.08)\");\n  glow.addColorStop(1, \"rgba(0,0,0,0)\");\n  ctx.fillStyle = glow;\n  ctx.fillRect(0, 0, w, h);\n\n  const cos = Math.cos(rotation);\n  const sin = Math.sin(rotation);\n\n  // Titik kecil bercahaya tanpa shadow berat satu per satu, supaya frame lebih stabil.\n  for (const p of particles) {\n    const localProgress = Math.max(0, Math.min(1, (progress - p.delay) / 0.50));\n    const ease = 1 - Math.pow(1 - localProgress, 3);\n    const ox = p.sx + (p.tx - p.sx) * ease;\n    const oy = p.sy + (p.ty - p.sy) * ease;\n    const depth = ox * sin;\n    const perspective = 1 + depth / 1250;\n    const x = cx + ox * cos * pulse * perspective;\n    const y = cy + oy * pulse * perspective;\n    const sparkle = 0.62 + 0.38 * Math.sin(time * 0.0028 + p.twinkle);\n    const alpha = sparkle * Math.min(1, localProgress * 2.2);\n    const light = 48 + p.hue * 32;\n\n    ctx.globalAlpha = alpha;\n    ctx.fillStyle = `hsl(${350 + p.hue * 18}, 100%, ${light}%)`;\n    ctx.beginPath();\n    ctx.arc(x, y, p.size * (0.88 + sparkle * 0.18), 0, Math.PI * 2);\n    ctx.fill();\n  }\n  ctx.globalAlpha = 1;\n\n  // Kilau halus di sepanjang tepi hati.\n  if (progress > 0.78) {\n    for (let i = 0; i < 26; i++) {\n      const t = i * Math.PI * 2 / 26;\n      const point = heartPoint(t);\n      const x = cx + point.x * heartScale * pulse;\n      const y = cy + point.y * heartScale * pulse;\n      const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(time * 0.0028 + i * 1.7));\n\n      ctx.globalAlpha = twinkle;\n      ctx.fillStyle = \"#ffe1e9\";\n      ctx.beginPath();\n      ctx.arc(x, y, 1.1 + twinkle * 1.3, 0, Math.PI * 2);\n      ctx.fill();\n    }\n    ctx.globalAlpha = 1;\n  }\n}\n\nfunction createFlowers() {\n  flowers = [];\n  const count = Math.max(5, Math.min(11, Math.ceil(w / 105)));\n  for (let i = 0; i < count; i++) {\n    flowers.push({\n      x: ((i + 0.5) / count) * w + (Math.random() - 0.5) * 24,\n      height: Math.min(h * 0.25, 85 + Math.random() * 75),\n      size: Math.max(8, Math.min(16, Math.min(w, h) * 0.022)),\n      delay: 0.8 + i * 0.24 + Math.random() * 0.4,\n      phase: Math.random() * Math.PI * 2,\n      petals: 5 + Math.floor(Math.random() * 3),\n      color: Math.random()\n    });\n  }\n}\n\nfunction flowerEase(v) {\n  v = Math.max(0, Math.min(1, v));\n  return 1 - Math.pow(1 - v, 3);\n}\n\nfunction drawFlowers(time) {\n  const ground = h + 2;\n\n  for (const f of flowers) {\n    const growth = flowerEase((elapsed - f.delay) / 2.0);\n    if (growth <= 0) continue;\n\n    const sway = Math.sin(time * 0.0011 + f.phase) * 5 * growth;\n    const stemH = f.height * growth;\n    const stemX = f.x + sway * 0.35;\n    const flowerY = ground - stemH;\n\n    ctx.save();\n    ctx.lineCap = \"round\";\n\n    // Tangkai tumbuh dari tepi bawah layar.\n    ctx.strokeStyle = \"#4dba72\";\n    ctx.lineWidth = 2.4;\n    ctx.beginPath();\n    ctx.moveTo(f.x, ground);\n    ctx.quadraticCurveTo(f.x - sway, ground - stemH * 0.55, stemX, flowerY);\n    ctx.stroke();\n\n    // Daun muncul bertahap pada tangkai.\n    for (let j = 0; j < 2; j++) {\n      const leafAt = j === 0 ? 0.38 : 0.67;\n      if (growth < leafAt * 0.55) continue;\n      const leafProgress = flowerEase((growth - leafAt * 0.55) / 0.45);\n      const yy = ground - stemH * leafAt;\n      const side = j === 0 ? -1 : 1;\n\n      ctx.save();\n      ctx.translate(f.x + sway * leafAt * 0.35, yy);\n      ctx.rotate(side * 0.48);\n      ctx.fillStyle = \"#65c982\";\n      ctx.beginPath();\n      ctx.ellipse(side * 7, 0, 8 * leafProgress, 3.5 * leafProgress, 0, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.restore();\n    }\n\n    // Kuncup membesar, lalu kelopak membuka.\n    const bloom = flowerEase((elapsed - f.delay - 1.0) / 1.3);\n    const r = f.size * (0.22 + bloom * 0.78);\n    const bob = Math.sin(time * 0.0017 + f.phase) * 1.4;\n\n    ctx.translate(stemX, flowerY + bob);\n    ctx.rotate(Math.sin(time * 0.001 + f.phase) * 0.06);\n\n    if (bloom < 0.08) {\n      ctx.fillStyle = \"#ff789f\";\n      ctx.beginPath();\n      ctx.ellipse(0, 0, r * 0.34, r * 0.68, 0, 0, Math.PI * 2);\n      ctx.fill();\n    } else {\n      const palettes = [\n        [\"#ffe1eb\", \"#ff78a0\"],\n        [\"#ffc4d7\", \"#f83e79\"],\n        [\"#ffd4df\", \"#ff91ad\"]\n      ];\n      const palette = palettes[Math.floor(f.color * palettes.length)];\n      const open = 0.2 + bloom * 0.8;\n\n      for (let k = 0; k < f.petals; k++) {\n        const angle = (Math.PI * 2 * k / f.petals) - Math.PI / 2;\n        ctx.save();\n        ctx.rotate(angle);\n        ctx.translate(0, -r * 0.42 * open);\n        ctx.scale(0.72, open);\n        const grad = ctx.createLinearGradient(0, -r, 0, r * 0.3);\n        grad.addColorStop(0, palette[0]);\n        grad.addColorStop(1, palette[1]);\n        ctx.fillStyle = grad;\n        ctx.shadowColor = \"rgba(255,85,135,.6)\";\n        ctx.shadowBlur = 7;\n        ctx.beginPath();\n        ctx.ellipse(0, -r * 0.2, r * 0.39, r * 0.64, 0, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.restore();\n      }\n\n      ctx.shadowColor = \"rgba(255,224,130,.9)\";\n      ctx.shadowBlur = 8;\n      ctx.fillStyle = \"#ffdc78\";\n      ctx.beginPath();\n      ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);\n      ctx.fill();\n      ctx.shadowBlur = 0;\n    }\n\n    ctx.restore();\n  }\n}\n\nfunction animate(time) {\n  requestAnimationFrame(animate);\n\n  const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 1 / 60;\n  lastTime = time;\n  elapsed += dt;\n\n  ctx.clearRect(0, 0, w, h);\n  drawStars(time);\n\n  if (progress < 1) {\n    progress = Math.min(1, progress + 0.22 * dt);\n  }\n  if (progress > 0.75) {\n    rotation += 0.22 * dt;\n  }\n  // Putaran partikel dan kilau bergerak konsisten pada 30/60/120Hz.\n  for (const p of particles) {\n    p.angle += p.spin * dt * 60;\n  }\n\n  drawHeart(time);\n  drawFlowers(time);\n}\n\ndocument.addEventListener(\"visibilitychange\", () => {\n  // Hindari lonjakan waktu saat tab kembali aktif.\n  lastTime = 0;\n});\n\nwindow.addEventListener(\"resize\", resize);\nresize();\nrequestAnimationFrame(animate);\n<\/script>\n</body>\n</html>","<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>For You 💗</title>\n<style>\n  * {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n    user-select: none;\n  }\n\n  body {\n    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;\n    overflow: hidden;\n    background:\n      radial-gradient(ellipse at 50% 42%, rgba(120, 0, 32, .38) 0%, transparent 48%),\n      radial-gradient(circle at 15% 18%, rgba(150, 0, 42, .20), transparent 34%),\n      radial-gradient(circle at 85% 82%, rgba(90, 0, 35, .24), transparent 38%),\n      linear-gradient(145deg, #30000b 0%, #140008 52%, #030004 100%);\n    background-attachment: fixed;\n    height: 100vh;\n    height: 100svh;\n    width: 100%;\n    isolation: isolate;\n  }\n\n  body::before {\n    content: \"\";\n    position: fixed;\n    inset: 0;\n    z-index: 0;\n    pointer-events: none;\n    background:\n      radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .28) 100%),\n      linear-gradient(180deg, rgba(255, 30, 75, .025), transparent 42%, rgba(0, 0, 0, .12));\n  }\n\n  /* Canvas Particle Background */\n  #bg-canvas {\n    position: fixed;\n    top: 0;\n    left: 0;\n    width: 100%;\n    height: 100%;\n    pointer-events: none;\n    z-index: 1;\n  }\n\n  .page {\n    position: fixed;\n    inset: 0;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    align-items: center;\n    text-align: center;\n    transition: opacity 0.85s cubic-bezier(.22, .75, .2, 1), transform 0.85s cubic-bezier(.22, .75, .2, 1), visibility 0.85s;\n    padding: 20px;\n    z-index: 2;\n  }\n\n  /* --- HALAMAN 1 --- */\n  #page1 {\n    background:\n      radial-gradient(ellipse at 50% 45%, rgba(255, 0, 55, .13), transparent 52%),\n      linear-gradient(145deg, rgba(48, 0, 11, .42), rgba(20, 0, 8, .32) 58%, rgba(3, 0, 4, .28));\n    z-index: 5;\n  }\n\n  #page1.hide {\n    opacity: 0;\n    transform: scale(1.15);\n    visibility: hidden;\n    pointer-events: none;\n  }\n\n  .target-container {\n    position: relative;\n    width: 180px;\n    height: 160px;\n    margin: 20px 0 30px;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n  }\n\n  /* Heart Shape */\n  .heart {\n    position: relative;\n    width: 100px;\n    height: 90px;\n    animation: beat 1.55s infinite cubic-bezier(0.37, 0, 0.25, 1);\n    transform-origin: 50% 55%;\n    will-change: transform;\n    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);\n  }\n\n  .heart::before,\n  .heart::after {\n    content: \"\";\n    position: absolute;\n    width: 55px;\n    height: 90px;\n    background: linear-gradient(180deg, #d7193f, #7f1025);\n    border-radius: 55px 55px 0 0;\n    box-shadow: 0 4px 18px rgba(255, 18, 66, 0.32), 0 0 28px rgba(255, 0, 55, .18);\n  }\n\n  .heart::before {\n    left: 55px;\n    transform: rotate(-45deg);\n    transform-origin: 0 100%;\n  }\n\n  .heart::after {\n    left: 0;\n    transform: rotate(45deg);\n    transform-origin: 100% 100%;\n  }\n\n  @keyframes beat {\n    0%, 100% { transform: scale(1); }\n    50% { transform: scale(1.085); }\n  }\n\n  .heart.hit {\n    animation: hitPulse 0.4s ease forwards !important;\n  }\n\n  @keyframes hitPulse {\n    0% { transform: scale(1.15); }\n    50% { transform: scale(1.4) rotate(10deg); }\n    100% { transform: scale(1.2); }\n  }\n\n  /* Panah Cupid */\n  .arrow-projectile {\n    position: absolute;\n    bottom: -150px;\n    left: 50%;\n    transform: translateX(-50%) rotate(-45deg);\n    width: 65px;\n    height: 65px;\n    pointer-events: none;\n    opacity: 0;\n    z-index: 10;\n  }\n\n  .arrow-projectile.shoot {\n    animation: shootArrow 0.78s cubic-bezier(.16, 1, .3, 1) forwards;\n    will-change: transform, opacity, bottom;\n  }\n\n  @keyframes shootArrow {\n    0% {\n      bottom: -150px;\n      opacity: 0;\n      transform: translateX(-50%) scale(0.6) rotate(-45deg);\n    }\n    20% { opacity: 1; }\n    100% {\n      bottom: 40px;\n      opacity: 1;\n      transform: translateX(-50%) scale(1.1) rotate(-45deg);\n    }\n  }\n\n  .arrow-shaft {\n    position: absolute;\n    width: 4px;\n    height: 55px;\n    background: #6a1b29;\n    left: 30px;\n    top: 5px;\n    border-radius: 2px;\n  }\n\n  .arrow-head {\n    position: absolute;\n    top: 0;\n    left: 23px;\n    width: 0;\n    height: 0;\n    border-left: 9px solid transparent;\n    border-right: 9px solid transparent;\n    border-bottom: 18px solid #a80f2d;\n  }\n\n  .arrow-feather {\n    position: absolute;\n    bottom: 0;\n    left: 21px;\n    width: 22px;\n    height: 14px;\n    background: #c94a62;\n    clip-path: polygon(0 0, 50% 100%, 100% 0, 75% 0, 50% 60%, 25% 0);\n  }\n\n  .btn-shoot {\n    margin-top: 20px;\n    border: none;\n    background: linear-gradient(45deg, #d7193f, #b51e3b);\n    color: white;\n    border-radius: 50px;\n    padding: 16px 36px;\n    font-size: 18px;\n    font-weight: 600;\n    cursor: pointer;\n    box-shadow: 0 8px 25px rgba(127, 16, 37, 0.5);\n    transition: all 0.25s ease;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n\n  .btn-shoot:hover {\n    transform: translateY(-3px) scale(1.03);\n    box-shadow: 0 12px 30px rgba(127, 16, 37, 0.65);\n  }\n\n  .btn-shoot:active {\n    transform: translateY(1px) scale(0.98);\n  }\n\n  /* --- HALAMAN 2 --- */\n  #page2 {\n    background:\n      radial-gradient(ellipse at 50% 24%, rgba(255, 0, 55, .12), transparent 50%),\n      linear-gradient(145deg, rgba(43, 0, 13, .45), rgba(20, 0, 8, .42) 60%, rgba(3, 0, 4, .34));\n    opacity: 0;\n    visibility: hidden;\n    transform: scale(0.92);\n    z-index: 3;\n    overflow-y: auto;\n  }\n\n  #page2.show {\n    opacity: 1;\n    visibility: visible;\n    transform: scale(1);\n  }\n\n  .card-container {\n    background: linear-gradient(145deg, rgba(255, 244, 247, .96), rgba(255, 225, 233, .94));\n    backdrop-filter: blur(14px);\n    -webkit-backdrop-filter: blur(14px);\n    border: 1.5px solid rgba(255, 220, 230, 0.78);\n    border-radius: 28px;\n    padding: 30px 25px;\n    max-width: 420px;\n    width: 100%;\n    box-shadow: 0 20px 40px rgba(75, 7, 24, 0.35);\n    position: relative;\n    z-index: 5;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n  }\n\n  h1 {\n    color: #8b1028;\n    font-size: 26px;\n    margin-bottom: 12px;\n    text-shadow: 0 2px 4px rgba(75, 7, 24, 0.35);\n  }\n\n  p {\n    color: #5b1021;\n    font-size: 16px;\n    line-height: 1.7;\n    margin-bottom: 15px;\n  }\n\n  /* KUE ULANG TAHUN BERLAPIS & ANIMASI DARI BAWAH KE ATAS */\n  .cake-wrapper {\n    position: relative;\n    width: 220px;\n    height: 190px;\n    margin: 15px 0 25px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: flex-end;\n  }\n\n  /* Layer 1: Piring Kue */\n  .cake-plate {\n    width: 210px;\n    height: 18px;\n    background: #ffffff;\n    border-radius: 50%;\n    box-shadow: 0 6px 15px rgba(0,0,0,0.1), inset 0 -3px 0 #e6e6e6;\n    opacity: 0;\n    transform: translateY(60px);\n    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;\n  }\n\n  /* Layer 2: Kue Bawah (Cake Layer Bottom) */\n  .cake-bottom-layer {\n    position: relative;\n    width: 170px;\n    height: 55px;\n    background: linear-gradient(to right, #b51e3b, #8b1028);\n    border-radius: 12px 12px 6px 6px;\n    margin-bottom: -6px;\n    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1);\n    opacity: 0;\n    transform: translateY(80px);\n    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;\n  }\n  .cake-bottom-layer::before {\n    content: '';\n    position: absolute;\n    top: 0;\n    left: 0;\n    width: 100%;\n    height: 18px;\n    background: #ffffff;\n    border-radius: 12px 12px 10px 10px;\n  }\n\n  /* Layer 3: Kue Atas (Cake Layer Top) */\n  .cake-top-layer {\n    position: relative;\n    width: 125px;\n    height: 48px;\n    background: linear-gradient(to right, #d7193f, #b51e3b);\n    border-radius: 10px 10px 4px 4px;\n    margin-bottom: -5px;\n    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08);\n    opacity: 0;\n    transform: translateY(100px);\n    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;\n  }\n  .cake-top-layer::before {\n    content: '';\n    position: absolute;\n    top: 0;\n    left: 0;\n    width: 100%;\n    height: 15px;\n    background: #ffe8eb;\n    border-radius: 10px 10px 8px 8px;\n  }\n\n  /* Layer 4: Lilin Ultah (Candle) */\n  .candle-container {\n    position: relative;\n    width: 16px;\n    height: 45px;\n    background: repeating-linear-gradient(45deg, #ffffff, #ffffff 6px, #d7193f 6px, #d7193f 12px);\n    border-radius: 4px 4px 0 0;\n    opacity: 0;\n    transform: translateY(120px);\n    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;\n    cursor: pointer;\n  }\n\n  /* Nyala Api Lilin */\n  .candle-flame {\n    position: absolute;\n    top: -22px;\n    left: 50%;\n    transform: translateX(-50%) rotate(-45deg);\n    width: 16px;\n    height: 22px;\n    background: linear-gradient(45deg, #ffb52e, #e53935);\n    border-radius: 50% 50% 50% 0;\n    box-shadow: 0 0 15px #ffb52e;\n    animation: flameFlicker 0.6s infinite alternate ease-in-out;\n    transition: opacity 0.4s ease, transform 0.4s ease;\n  }\n\n  .candle-flame.blown-out {\n    opacity: 0;\n    transform: translateX(-50%) scale(0.2) rotate(-45deg);\n  }\n\n  /* Efek Asap Saat Lilin Ditiup */\n  .smoke {\n    position: absolute;\n    top: -25px;\n    left: 50%;\n    width: 8px;\n    height: 8px;\n    background: rgba(180, 180, 180, 0.7);\n    border-radius: 50%;\n    pointer-events: none;\n    opacity: 0;\n  }\n\n  .smoke.active {\n    animation: smokeRise 1.2s ease-out forwards;\n  }\n\n  @keyframes smokeRise {\n    0% { opacity: 0.8; transform: translate(-50%, 0) scale(1); }\n    100% { opacity: 0; transform: translate(-50%, -40px) scale(3); }\n  }\n\n  @keyframes flameFlicker {\n    0% { transform: translateX(-50%) rotate(-48deg) scale(0.95); }\n    100% { transform: translateX(-50%) rotate(-42deg) scale(1.08); }\n  }\n\n  /* Triggers untuk animasi berurutan dari bawah ke atas */\n  .cake-wrapper.assembled .cake-plate {\n    opacity: 1;\n    transform: translateY(0);\n    transition-delay: 0.1s;\n  }\n  .cake-wrapper.assembled .cake-bottom-layer {\n    opacity: 1;\n    transform: translateY(0);\n    transition-delay: 0.35s;\n  }\n  .cake-wrapper.assembled .cake-top-layer {\n    opacity: 1;\n    transform: translateY(0);\n    transition-delay: 0.6s;\n  }\n  .cake-wrapper.assembled .candle-container {\n    opacity: 1;\n    transform: translateY(0);\n    transition-delay: 0.85s;\n  }\n\n  /* EFEK LOVE BANYAK BERMUNCULAN DARI BAWAH */\n  .love-particle {\n    position: fixed;\n    bottom: -50px;\n    pointer-events: none;\n    z-index: 2;\n    will-change: transform, opacity;\n    animation: floatUp 4.2s cubic-bezier(.22, .62, .32, 1) forwards;\n    will-change: transform, opacity;\n  }\n\n  @keyframes floatUp {\n    0% {\n      transform: translateY(0) scale(0.4) rotate(0deg);\n      opacity: 0;\n    }\n    15% {\n      opacity: 0.9;\n    }\n    85% {\n      opacity: 0.9;\n    }\n    100% {\n      transform: translate3d(0, -115vh, 0) scale(1.3) rotate(45deg);\n      opacity: 0;\n    }\n  }\n\n  /* EFEK LEDAKAN SPARKLE SAAT DITEMBAK */\n  .sparkle-burst {\n    position: absolute;\n    pointer-events: none;\n    width: 8px;\n    height: 8px;\n    border-radius: 50%;\n    z-index: 15;\n    animation: burstOut 0.6s ease-out forwards;\n  }\n\n  @keyframes burstOut {\n    0% { transform: translate(0, 0) scale(1); opacity: 1; }\n    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }\n  }\n\n  /* TOMBOL KEMBALI DI POJOK KIRI BAWAH */\n  .btn-back {\n    position: fixed;\n    bottom: 22px;\n    left: 22px;\n    background: rgba(255, 238, 243, 0.94);\n    border: 1.5px solid #c94a62;\n    color: #8b1028;\n    padding: 10px 18px;\n    border-radius: 30px;\n    font-size: 14px;\n    font-weight: 600;\n    cursor: pointer;\n    box-shadow: 0 4px 15px rgba(75, 7, 24, 0.3);\n    backdrop-filter: blur(5px);\n    transition: all 0.25s ease;\n    z-index: 99;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n  }\n\n  .btn-back:hover {\n    background: #ffffff;\n    transform: translateY(-2px);\n    box-shadow: 0 6px 20px rgba(75, 7, 24, 0.45);\n    color: #e11d48;\n  }\n\n  .small-note {\n    font-size: 13px;\n    color: #6b1729;\n    margin-top: 5px;\n    font-style: italic;\n  }\n\n  /* Screen shake animation */\n  .shake {\n    animation: screenShake 0.4s ease;\n  }\n\n  @keyframes screenShake {\n    0%, 100% { transform: translate(0, 0); }\n    20% { transform: translate(-6px, 4px); }\n    40% { transform: translate(6px, -4px); }\n    60% { transform: translate(-4px, -2px); }\n    80% { transform: translate(4px, 2px); }\n  }\n\n  /* Glitter / kilau yang terus berkelap-kelip */\n  .glitter {\n    position: fixed;\n    width: var(--size, 4px);\n    height: var(--size, 4px);\n    border-radius: 50%;\n    pointer-events: none;\n    z-index: 20;\n    background: #fff7c2;\n    box-shadow: 0 0 6px 2px rgba(255, 215, 120, .9),\n                0 0 14px 4px rgba(255, 255, 255, .55);\n    animation: glitterTwinkle var(--duration, 2s) ease-in-out infinite;\n  }\n  .glitter::after {\n    content: \"✦\";\n    position: absolute;\n    color: #fff8d8;\n    font-size: calc(var(--size, 4px) * 3);\n    line-height: 1;\n    left: 50%;\n    top: 50%;\n    transform: translate(-50%, -50%);\n    text-shadow: 0 0 8px #ffd76a;\n  }\n  @keyframes glitterTwinkle {\n    0%, 100% { opacity: .15; transform: scale(.45) rotate(0deg); }\n    50% { opacity: 1; transform: scale(1.2) rotate(45deg); }\n  }\n\n\n  /* RESPONSIVE: tetap rapi di HP, tablet, dan laptop */\n  html {\n    min-height: 100%;\n    -webkit-text-size-adjust: 100%;\n  }\n\n  body {\n    min-height: 100vh;\n    min-height: 100svh;\n  }\n\n  .page {\n    padding: clamp(14px, 3vw, 28px);\n  }\n\n  #page1 {\n    overflow-y: auto;\n    overscroll-behavior: contain;\n  }\n\n  #page2 {\n    overflow-x: hidden;\n    overflow-y: auto;\n    -webkit-overflow-scrolling: touch;\n    overscroll-behavior-y: contain;\n    justify-content: flex-start;\n    padding-top: max(24px, env(safe-area-inset-top));\n    padding-bottom: max(82px, calc(24px + env(safe-area-inset-bottom)));\n  }\n\n  .card-container {\n    width: min(100%, 460px);\n    padding: clamp(20px, 4vw, 32px);\n    margin: auto;\n    flex: 0 0 auto;\n  }\n\n  .card-container h1 {\n    max-width: 100%;\n    overflow-wrap: anywhere;\n    font-size: clamp(21px, 5vw, 27px);\n    line-height: 1.25;\n  }\n\n  .card-container p {\n    max-width: 100%;\n    font-size: clamp(14px, 3.7vw, 16px);\n    line-height: 1.7;\n    overflow-wrap: break-word;\n  }\n\n  .cake-wrapper {\n    width: min(220px, 72vw);\n    flex: 0 0 auto;\n  }\n\n  .btn-back {\n    bottom: max(14px, env(safe-area-inset-bottom));\n    left: max(14px, env(safe-area-inset-left));\n  }\n\n  @media (max-width: 600px) {\n    .page {\n      padding: 16px 14px;\n    }\n\n    #page1 {\n      justify-content: center;\n    }\n\n    .target-container {\n      transform: scale(.88);\n      margin: 8px 0 12px;\n    }\n\n    #page1 > p {\n      max-width: 320px;\n      font-size: 15px !important;\n      line-height: 1.5;\n    }\n\n    #page1 h1 {\n      font-size: clamp(21px, 6vw, 26px);\n      line-height: 1.25;\n    }\n\n    .btn-shoot {\n      padding: 14px 28px;\n      font-size: 16px;\n    }\n\n    #page2 {\n      padding-left: 12px;\n      padding-right: 12px;\n    }\n\n    .card-container {\n      border-radius: 22px;\n      padding: 20px 17px;\n    }\n\n    .cake-wrapper {\n      margin: 8px 0 16px;\n      transform: scale(.86);\n      height: 170px;\n    }\n\n    .btn-back {\n      padding: 9px 15px;\n      font-size: 13px;\n    }\n  }\n\n  @media (max-height: 650px) and (min-width: 601px) {\n    #page1 {\n      justify-content: flex-start;\n      overflow-y: auto;\n    }\n\n    #page2 {\n      justify-content: flex-start;\n    }\n\n    .target-container {\n      margin: 4px 0 8px;\n      transform: scale(.78);\n    }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after {\n      animation-duration: .01ms !important;\n      animation-iteration-count: 1 !important;\n      scroll-behavior: auto !important;\n      transition-duration: .01ms !important;\n    }\n  }\n\n</style>\n</head>\n<body>\n\n<canvas id=\"bg-canvas\"></canvas>\n\n<!-- TOMBOL KEMBALI POJOK KIRI BAWAH -->\n<!-- HALAMAN PERTAMA -->\n<section class=\"page\" id=\"page1\">\n  <p style=\"font-size: 18px; font-weight: 500; color: #fff0f2;\">Haiii, ada sesuatu khusus buat kamu 💌</p>\n  \n  <div class=\"target-container\" id=\"targetContainer\">\n    <div class=\"heart\" id=\"mainHeart\"></div>\n    <div class=\"arrow-projectile\" id=\"arrowProjectile\">\n      <div class=\"arrow-head\"></div>\n      <div class=\"arrow-shaft\"></div>\n      <div class=\"arrow-feather\"></div>\n    </div>\n  </div>\n\n  <h1 style=\"color:#fff0f2;\">A little surprise for you ❤️</h1>\n  <p style=\"color:#ffe1e6;\">Klik panah cinta di bawah ini ya sayangku...</p>\n\n  <button class=\"btn-shoot\" id=\"shootBtn\" onclick=\"launchArrow()\">\n    <span>Tembak Hati 💘</span>\n  </button>\n</section>\n\n<!-- HALAMAN KEDUA -->\n<section class=\"page\" id=\"page2\">\n  <div class=\"card-container\">\n    <h1>🎂 Kue Kecil untuk Kamu 💗</h1>\n\n    <!-- KUE ULANG TAHUN DENGAN LAYER ANIMASI DARI BAWAH -->\n    <div class=\"cake-wrapper\" id=\"cakeWrapper\">\n      <!-- Layer 4: Lilin -->\n      <div class=\"candle-container\" id=\"candle\" onclick=\"blowCandle()\" title=\"Klik untuk tiup lilin!\">\n        <div class=\"candle-flame\" id=\"candleFlame\"></div>\n        <div class=\"smoke\" id=\"smoke\"></div>\n      </div>\n      <!-- Layer 3: Kue Atas -->\n      <div class=\"cake-top-layer\"></div>\n      <!-- Layer 2: Kue Bawah -->\n      <div class=\"cake-bottom-layer\"></div>\n      <!-- Layer 1: Piring -->\n      <div class=\"cake-plate\"></div>\n    </div>\n\n    <h1>Semoga Kamu Suka Kuenya ya 💗</h1>\n\n    <p>\n      Aku bikin kue kecil ini khusus untuk kamu aku membuatnya dengan sepenuh hati.<br><br>\n      Maaf ya kalau aku belum bisa memberikan yang terbaik untuk kamu. Aku berharap kue kecil ini tetap bisa membuatmu tersenyum dan merasa istimewa hari ini.<br><br>\n      Semoga hari ini dan setelahnya dipenuhi hal-hal manis, seperti kue kecil ini. ❤️\n    </p>\n\n    <p class=\"small-note\" id=\"candleTip\">✨ Sentuh api lilinnya untuk meniup ✨</p>\n  </div>\n</section>\n\n<script>\n  let loveInterval = null;\n\n  // Bintang glitter emas yang berkelap-kelip di seluruh layar\n  function addGlitter() {\n    const glitter = document.createElement('span');\n    glitter.className = 'glitter';\n    glitter.style.left = (Math.random() * 100) + 'vw';\n    glitter.style.top = (Math.random() * 100) + 'vh';\n    glitter.style.setProperty('--size', (2 + Math.random() * 4) + 'px');\n    glitter.style.setProperty('--duration', (1.2 + Math.random() * 2.2) + 's');\n    glitter.style.animationDelay = (-Math.random() * 2) + 's';\n    document.body.appendChild(glitter);\n  }\n  for (let i = 0; i < 42; i++) addGlitter();\n\n\n  // Background Particle System\n  const canvas = document.getElementById('bg-canvas');\n  const ctx = canvas.getContext('2d', { alpha: true });\n  let particles = [];\n  let canvasW = 0;\n  let canvasH = 0;\n  let canvasDpr = 1;\n  let lastCanvasFrame = 0;\n\n  function resizeCanvas() {\n    canvasDpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.5 : 2);\n    canvasW = window.innerWidth;\n    canvasH = window.innerHeight;\n    canvas.width = Math.round(canvasW * canvasDpr);\n    canvas.height = Math.round(canvasH * canvasDpr);\n    canvas.style.width = canvasW + 'px';\n    canvas.style.height = canvasH + 'px';\n    ctx.setTransform(canvasDpr, 0, 0, canvasDpr, 0, 0);\n    const count = Math.max(38, Math.min(72, Math.round(canvasW / 17)));\n    particles = Array.from({ length: count }, () => new SoftParticle(true));\n  }\n  window.addEventListener('resize', resizeCanvas, { passive: true });\n\n  class SoftParticle {\n    constructor(randomY = false) {\n      this.reset(randomY);\n    }\n    reset(randomY = false) {\n      this.x = Math.random() * canvasW;\n      this.y = randomY ? Math.random() * canvasH : canvasH + 8;\n      this.size = Math.random() * 1.7 + 0.45;\n      this.speedY = Math.random() * 13 + 7;\n      this.speedX = (Math.random() - 0.5) * 5;\n      this.phase = Math.random() * Math.PI * 2;\n      this.opacity = Math.random() * 0.45 + 0.18;\n      this.pink = Math.random() > 0.42;\n    }\n    update(dt) {\n      this.y -= this.speedY * dt;\n      this.x += (this.speedX + Math.sin(this.phase) * 2.2) * dt;\n      this.phase += dt * 0.7;\n      if (this.y < -8) this.reset(false);\n      if (this.x < -10) this.x = canvasW + 8;\n      if (this.x > canvasW + 10) this.x = -8;\n    }\n    draw(time) {\n      const pulse = 0.72 + 0.28 * Math.sin(time * 0.0018 + this.phase);\n      const alpha = this.opacity * pulse;\n      ctx.beginPath();\n      ctx.arc(this.x, this.y, this.size * (0.85 + pulse * 0.2), 0, Math.PI * 2);\n      ctx.fillStyle = this.pink\n        ? `rgba(255, 105, 145, ${alpha})`\n        : `rgba(255, 215, 150, ${alpha * 0.9})`;\n      ctx.shadowColor = this.pink ? 'rgba(255, 35, 90, .75)' : 'rgba(255, 205, 120, .65)';\n      ctx.shadowBlur = this.size * 4;\n      ctx.fill();\n      ctx.shadowBlur = 0;\n    }\n  }\n\n  function animateCanvas(time) {\n    requestAnimationFrame(animateCanvas);\n    if (document.hidden) {\n      lastCanvasFrame = time;\n      return;\n    }\n    const dt = lastCanvasFrame ? Math.min((time - lastCanvasFrame) / 1000, 0.04) : 1 / 60;\n    lastCanvasFrame = time;\n    ctx.clearRect(0, 0, canvasW, canvasH);\n\n    // Lapisan cahaya merah lembut di belakang partikel.\n    const glow = ctx.createRadialGradient(canvasW * .5, canvasH * .48, 0, canvasW * .5, canvasH * .48, Math.max(canvasW, canvasH) * .58);\n    glow.addColorStop(0, 'rgba(210, 0, 48, .075)');\n    glow.addColorStop(.55, 'rgba(100, 0, 28, .035)');\n    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');\n    ctx.fillStyle = glow;\n    ctx.fillRect(0, 0, canvasW, canvasH);\n\n    particles.forEach(p => {\n      p.update(dt);\n      p.draw(time);\n    });\n  }\n\n  document.addEventListener('visibilitychange', () => {\n    lastCanvasFrame = 0;\n  });\n  resizeCanvas();\n  requestAnimationFrame(animateCanvas);\n\n  // Animasi Menembakkan Panah\n  function launchArrow() {\n    const shootBtn = document.getElementById('shootBtn');\n    const arrow = document.getElementById('arrowProjectile');\n    const heart = document.getElementById('mainHeart');\n    const targetContainer = document.getElementById('targetContainer');\n\n    shootBtn.style.pointerEvents = 'none';\n    shootBtn.style.opacity = '0.6';\n\n    // Animasi Meluncur\n    arrow.classList.add('shoot');\n\n    // Saat mengenai sasaran (sekitar 500ms)\n    setTimeout(() => {\n      heart.classList.add('hit');\n      document.body.classList.add('shake');\n      createSparkleBurst(targetContainer);\n\n      setTimeout(() => {\n        document.body.classList.remove('shake');\n      }, 400);\n\n      // Pindah ke Halaman 2\n      setTimeout(() => {\n        transitionToPage2();\n      }, 600);\n    }, 500);\n  }\n\n  // Ledakan Sparkle Cahaya\n  function createSparkleBurst(container) {\n    const rect = container.getBoundingClientRect();\n    const centerX = rect.width / 2;\n    const centerY = rect.height / 2;\n    const colors = ['#d7193f', '#c94a62', '#ffffff', '#ffb52e', '#e11d48'];\n\n    for (let i = 0; i < 30; i++) {\n      const sparkle = document.createElement('div');\n      sparkle.className = 'sparkle-burst';\n      \n      const angle = Math.random() * Math.PI * 2;\n      const distance = 40 + Math.random() * 70;\n      const tx = Math.cos(angle) * distance + 'px';\n      const ty = Math.sin(angle) * distance + 'px';\n\n      sparkle.style.setProperty('--tx', tx);\n      sparkle.style.setProperty('--ty', ty);\n      sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];\n      sparkle.style.left = centerX + 'px';\n      sparkle.style.top = centerY + 'px';\n\n      container.appendChild(sparkle);\n      setTimeout(() => sparkle.remove(), 600);\n    }\n  }\n\n  // Pindah ke Halaman 2\n  function transitionToPage2() {\n    document.getElementById('page1').classList.add('hide');\n    const page2 = document.getElementById('page2');\n    page2.classList.add('show');\n\n    // Animasi Kue disusun dari bawah ke atas\n    setTimeout(() => {\n      document.getElementById('cakeWrapper').classList.add('assembled');\n    }, 200);\n\n    // Jalankan Aliran Hujan Love Melimpah dari Bawah\n    startAbundantLoveStream();\n  }\n\n  // Hujan Love yang Bermunculan Padat Dari Bawah\n  function createLoveParticle() {\n    const love = document.createElement('div');\n    love.className = 'love-particle';\n\n    const symbols = ['💗', '💕', '💖', '💘', '♥', '💓', '🌸', '✨'];\n    love.textContent = symbols[Math.floor(Math.random() * symbols.length)];\n\n    const posX = Math.random() * 100; // Dalam vw\n    const fontSize = 18 + Math.random() * 26; // Ukuran variatif\n    const duration = 2.5 + Math.random() * 2.5; // Kecepatan meluncur\n\n    love.style.left = posX + 'vw';\n    love.style.fontSize = fontSize + 'px';\n    love.style.animationDuration = duration + 's';\n\n    document.body.appendChild(love);\n\n    setTimeout(() => love.remove(), duration * 1000);\n  }\n\n  function startAbundantLoveStream() {\n    if (loveInterval) clearInterval(loveInterval);\n    \n    // Semburan awal melimpah\n    for (let i = 0; i < 20; i++) {\n      setTimeout(createLoveParticle, i * 80);\n    }\n\n    // Aliran berlanjut tanpa henti\n    loveInterval = setInterval(createLoveParticle, 180);\n  }\n\n  // Tiup Lilin\n  function blowCandle() {\n    const flame = document.getElementById('candleFlame');\n    const smoke = document.getElementById('smoke');\n    const note = document.getElementById('candleTip');\n\n    if (!flame.classList.contains('blown-out')) {\n      flame.classList.add('blown-out');\n      smoke.classList.add('active');\n      if (note) note.textContent = '🎉 Make a wish! Semoga semua impianmu terkabul ✨';\n      \n      // Ledakan love tambahan saat lilin ditiup\n      for (let i = 0; i < 25; i++) {\n        setTimeout(createLoveParticle, i * 50);\n      }\n    }\n  }\n\n  // Tombol Kembali\n  function resetToPage1() {\n    // Hentikan Aliran Love\n    if (loveInterval) {\n      clearInterval(loveInterval);\n      loveInterval = null;\n    }\n\n    // Hapus sisa elemen love di layar\n    document.querySelectorAll('.love-particle').forEach(el => el.remove());\n\n    // Reset elemen kue\n    const cakeWrapper = document.getElementById('cakeWrapper');\n    cakeWrapper.classList.remove('assembled');\n    document.getElementById('candleFlame').classList.remove('blown-out');\n    document.getElementById('smoke').classList.remove('active');\n    document.getElementById('candleTip').textContent = '✨ Sentuh api lilinnya untuk meniup ✨';\n\n    // Reset animasi panah & target\n    document.getElementById('arrowProjectile').classList.remove('shoot');\n    document.getElementById('mainHeart').classList.remove('hit');\n    \n    const shootBtn = document.getElementById('shootBtn');\n    shootBtn.style.pointerEvents = 'auto';\n    shootBtn.style.opacity = '1';\n\n    // Tampilkan kembali Halaman 1\n    document.getElementById('page2').classList.remove('show');\n    document.getElementById('page1').classList.remove('hide');\n  }\n<\/script>\n</body>\n</html>","<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<meta name=\"theme-color\" content=\"#3a0617\">\n<title>Untuk Kamu ❤️</title>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--maroon:#390716;--deep:#21040c;--red:#c51f48;--ruby:#ff456d;--pink:#ffe0e8}\nbody{font-family:Georgia,serif;background:var(--deep);color:var(--pink);overflow-x:hidden}\n.hero{min-height:100vh;min-height:100svh;position:relative;display:flex;align-items:center;justify-content:flex-end;padding:45px 6%;overflow:hidden;background:radial-gradient(ellipse at 78% 34%,#bd3457 0%,#76152f 33%,transparent 64%),linear-gradient(135deg,#1c030a,#650d27 56%,#280611)}\n/* POHON BESAR */\n.tree{position:absolute;left:-5%;top:-8%;width:64%;height:110%;z-index:1;pointer-events:none}\n.trunk{position:absolute;left:22%;top:10%;width:10%;height:100%;background:linear-gradient(90deg,#19050a,#70243a,#35101b);border-radius:45% 30% 0 0;transform:rotate(5deg);box-shadow:15px 0 30px #ff315522}\n.branch{position:absolute;height:20px;background:linear-gradient(#8e3047,#350813);border-radius:50%;transform-origin:left center}\n.branch.one{left:25%;top:25%;width:60%;transform:rotate(-30deg)}\n.branch.two{left:24%;top:39%;width:58%;transform:rotate(-8deg)}\n.branch.three{left:27%;top:48%;width:55%;transform:rotate(-43deg)}\n.branch.four{left:28%;top:32%;width:40%;transform:rotate(25deg)}\n.leaves{position:absolute;inset:0;background:radial-gradient(ellipse at 15% 8%,#ff536f 0 12%,transparent 13%),radial-gradient(ellipse at 35% 10%,#8d1735 0 17%,transparent 18%),radial-gradient(ellipse at 60% 13%,#d52d51 0 15%,transparent 16%),radial-gradient(ellipse at 25% 25%,#71132c 0 18%,transparent 19%),radial-gradient(ellipse at 53% 30%,#f04466 0 14%,transparent 15%),radial-gradient(ellipse at 10% 42%,#bd2346 0 17%,transparent 18%),radial-gradient(ellipse at 42% 44%,#81142f 0 18%,transparent 19%),radial-gradient(ellipse at 65% 4%,#a81c3b 0 15%,transparent 16%);filter:drop-shadow(0 0 9px #ff315655)}\n/* GALERI FOTO */\n.gallery{position:absolute;inset:0 auto 0 0;width:55%;z-index:2;pointer-events:none}\n.photo{position:absolute;width:clamp(75px,10vw,135px);aspect-ratio:3/4;background:#ffe6ec;padding:6px 6px 23px;box-shadow:0 0 15px #ff365c66,0 8px 22px #12020899;transform:rotate(-7deg);animation:float 4s ease-in-out infinite}\n.photo:nth-child(even){transform:rotate(7deg);animation-delay:-2s}\n.photo img{width:100%;height:100%;object-fit:cover;display:block}\n.photo span{position:absolute;bottom:4px;left:0;width:100%;text-align:center;font-size:10px;color:#76142d}\n.p1{left:5%;top:15%}.p2{left:38%;top:17%}.p3{left:17%;top:42%}.p4{left:40%;top:56%}.p5{left:5%;top:68%}\n@keyframes float{0%,100%{margin-top:0}50%{margin-top:-9px}}\n/* UCAPAN */\n.content{width:min(500px,48%);position:relative;z-index:3;text-align:center;padding:30px;background:linear-gradient(135deg,#710e2bdc,#320714ed);border:1px solid #ff9bb699;border-radius:25px;backdrop-filter:blur(7px);box-shadow:0 0 30px #ff174455,0 15px 45px #12020888}\n.small-title{font:12px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase}\nh1{font-size:clamp(42px,6vw,76px);font-weight:normal;font-style:italic;line-height:1.05;margin:18px 0;color:#ffd4df;text-shadow:0 0 18px #ff527766}\n.subtitle{font-size:18px;line-height:1.6}\n.heart{font-size:25px;margin:12px;color:#ff5278;text-shadow:0 0 14px #ff1744;animation:heartBeat 1.5s infinite}\n@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}\n.date{display:inline-block;background:linear-gradient(135deg,#e72d55,#8f1235);color:white;border-radius:30px;padding:10px 20px;margin-bottom:18px;font:bold 14px Arial,sans-serif;box-shadow:0 0 16px #ff315555}\n.message{font-size:15px;line-height:1.8}\n.signature{margin-top:15px;font-style:italic;font-size:19px}\n/* DAUN GUGUR */\n.falling-leaf{position:fixed;top:-40px;z-index:5;pointer-events:none;animation:fall linear forwards;filter:drop-shadow(0 0 5px #ff5577)}\n@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(720deg)}}\n/* GLITTER */\n.glitter{position:fixed;z-index:8;pointer-events:none;color:#fff1f5;text-shadow:0 0 5px #fff,0 0 12px #ff4d79,0 0 24px #ff1744;animation:sparkle 2s ease-in-out forwards}\n@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0)}35%{opacity:1;transform:scale(1.2) rotate(90deg)}70%{opacity:.8;transform:scale(.8) rotate(180deg)}100%{opacity:0;transform:scale(0) rotate(270deg)}}\n/* TOMBOL KEMBALI */\n.back{position:fixed;left:15px;bottom:15px;z-index:10;text-decoration:none;color:white;background:#680d2bef;border:1px solid #ff9bb6;border-radius:30px;padding:12px 17px;font:14px Arial,sans-serif;box-shadow:0 0 15px #ff315555}\n/* RESPONSIF HP */\n@media(max-width:760px){.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:25px 12px 75px}.tree{width:100%;height:55%;opacity:.9}.gallery{position:relative;inset:auto;width:100%;height:190px;flex:none}.photo{width:85px;padding:5px 5px 19px}.p1{left:4%;top:8px}.p2{left:25%;top:25px}.p3{left:47%;top:3px}.p4{left:68%;top:25px}.p5{left:38%;top:95px}.content{width:100%;max-width:480px;padding:22px 16px}.content{background:linear-gradient(145deg,#710e2bf2,#300611f5);box-shadow:0 0 22px #ff174444}h1{font-size:49px}.subtitle{font-size:16px}.message{font-size:14px}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}\n</style>\n</head>\n<body>\n<main class=\"hero\" id=\"atas\">\n  <div class=\"tree\" aria-hidden=\"true\">\n    <div class=\"trunk\"></div><div class=\"branch one\"></div><div class=\"branch two\"></div><div class=\"branch three\"></div><div class=\"branch four\"></div><div class=\"leaves\"></div>\n  </div>\n  <div class=\"gallery\">\n    <!-- Letakkan f221f143-ea50-4594-b853-60ad405d52b7.jpg hingga e9039c35-c001-4fe3-84d4-a31a7b2e1862.jpg di folder yang sama dengan index.html -->\n    <div class=\"photo p1\"><img src=\"f221f143-ea50-4594-b853-60ad405d52b7.jpg\" alt=\"Foto kenangan 1\"><span>Kenangan manis ♡</span></div>\n    <div class=\"photo p2\"><img src=\"8f36640a-c5ef-4950-a92c-e13019dce068.jpg\" alt=\"Foto kenangan 2\"><span>Senyum favoritku</span></div>\n    <div class=\"photo p3\"><img src=\"49781e5f-2c09-4d5b-8258-9f223f5b7f91.jpg\" alt=\"Foto kenangan 3\"><span>Selalu kamu</span></div>\n    <div class=\"photo p4\"><img src=\"55aaa52a-16ec-4c5e-bcbf-f7a1c7500358.jpg\" alt=\"Foto kenangan 4\"><span>Hari istimewa</span></div>\n    <div class=\"photo p5\"><img src=\"e9039c35-c001-4fe3-84d4-a31a7b2e1862.jpg\" alt=\"Foto kenangan 5\"><span>My favorite person</span></div>\n  </div>\n  <section class=\"content\">\n    <div class=\"small-title\">SURPRISE SPECIAL FOR YOU</div>\n    <h1>Happy<br>Birthday</h1>\n    <p class=\"subtitle\">Untuk pacarku yang paling aku sayangi, Sulthon Baydhowi.</p>\n    <div class=\"heart\">♥</div>\n    <!-- Ganti tanggal di bawah ini sesuai ulang tahun pacarmu -->\n    <div class=\"date\">3 November 2026</div>\n    <p class=\"message\">\n      Selamat bertambah usia 19 tahun, Sulthon Baydhowi, orang yang paling aku sayangi.\n      <br><br>\n      Semangat, ya. Jangan pernah pantang menyerah dan tetaplah berusaha,\n      walaupun banyak masalah datang silih berganti. Aku percaya kamu kuat\n      dan mampu melewati semuanya.\n      <br><br>\n      Semoga apa pun yang kamu inginkan segera terwujud, selalu diberi\n      kemudahan dalam setiap langkah, dan dimudahkan untuk menggapai semua\n      cita-citamu. Jangan pernah berhenti percaya pada dirimu sendiri.\n      <br><br>\n      Selamat ulang tahun, sayangku. Aku selalu mendoakan yang terbaik\n      untukmu. Tetap jadi Sulthon yang hebat. Aku sayang kamu. ♥\n    </p>\n    <div class=\"signature\">I love you, always. ♡</div>\n  </section>\n</main>\n<script>\n/* Daun merah gugur */\nfunction createLeaf(){\n  if(window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches)return;\n  const leaf=document.createElement(\"div\");\n  leaf.className=\"falling-leaf\";\n  leaf.textContent=[\"🍂\",\"🍁\",\"♥\"][Math.floor(Math.random()*3)];\n  leaf.style.left=Math.random()*100+\"vw\";\n  leaf.style.setProperty(\"--drift\",(Math.random()*180-90)+\"px\");\n  leaf.style.fontSize=(15+Math.random()*15)+\"px\";\n  leaf.style.animationDuration=(5+Math.random()*6)+\"s\";\n  document.body.appendChild(leaf);\n  setTimeout(()=>leaf.remove(),12000);\n}\nsetInterval(createLeaf,650);\n\n/* Glitter merah, pink, dan putih berkilau */\nfunction createGlitter(){\n  if(window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches)return;\n  const glitter=document.createElement(\"span\");\n  glitter.className=\"glitter\";\n  glitter.textContent=[\"✦\",\"✧\",\"✶\",\"✨\",\"♥\"][Math.floor(Math.random()*5)];\n  glitter.style.left=Math.random()*100+\"vw\";\n  glitter.style.top=Math.random()*100+\"vh\";\n  glitter.style.fontSize=(8+Math.random()*18)+\"px\";\n  glitter.style.animationDuration=(1.5+Math.random()*2)+\"s\";\n  document.body.appendChild(glitter);\n  setTimeout(()=>glitter.remove(),4000);\n}\nsetInterval(createGlitter,180);\n<\/script>\n</body>\n</html>"];
let currentPage = 0;
const frame = document.getElementById("pageFrame");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const step = document.getElementById("step");

function showPage() {
  frame.srcdoc = pages[currentPage];
  backBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage === pages.length - 1;
  step.textContent = (currentPage + 1) + " / " + pages.length;
}
function go(direction) {
  const target = currentPage + direction;
  if (target < 0 || target >= pages.length) return;
  currentPage = target;
  showPage();
}
showPage();
</script>
